# X-AnyLabeling CPU build environment
#
# !! 本文件必须与 pyproject.toml 放在同一个仓库根目录。
# !! conda 会把 pip 子进程的工作目录设为“本 YAML 文件所在目录”，
# !! 因此把 YAML 单独复制到 D:\cbg 再执行，`-e .` 会指向 D:\cbg 并报：
# !!   file:///D:/cbg does not appear to be a Python project
# !! 正确做法是用仓库根里的这一份：
# !!   conda env create -f D:\path\to\repo\environment-cpu.yml
#
# 用法（YAML 与 pyproject.toml 同在仓库根）：
#   conda env create -f environment-cpu.yml
#   conda activate xanylabeling-cpu
#   python -c "import onnxruntime as ort; print(ort.get_available_providers())"
#
# 也可以在仓库根目录用脚本自动调用正确路径：
#   powershell -ExecutionPolicy Bypass -File scripts\setup_conda_env.ps1 -Device cpu
#
# 预期只看到 CPUExecutionProvider；这个环境不会安装 CUDA/cuDNN，
# 适合在无显卡机器上构建/运行 CPU 版 exe。
#
# 说明：
#   - `-e .[cpu,dev]` 同时安装项目本体、CPU ONNX Runtime、PyInstaller、
#     PySide6（提供 pyside6-lrelease）和测试工具；
#   - 不要在同一个环境中再安装 onnxruntime-gpu；
#   - 如果换了源码目录，需要重新执行一次 pip 的 editable 安装（见 docs/dev/打包环境-conda.md）。

name: xanylabeling-cpu

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip>=24.1
  - setuptools>=77
  - wheel

  - pip:
      - -e .[cpu,dev]
      # 显式列出，方便在 environment.yml 中直接看到 CPU 推理依赖；
      # 版本约束由 pyproject.toml 的 [cpu] extra 决定。
      - onnx
      - onnxruntime
